{% extends 'base.html' %}
{% block title %}Login - ShadowHub{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card dark-card">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="fas fa-spider fa-3x text-accent mb-2"></i>
            <h3 class="text-light">Welcome Back</h3>
            <p class="text-muted small">Sign in to your ShadowHub account</p>
          </div>
          <form method="post" action="{{ url_for('login') }}">
            <div class="mb-3">
              <label class="form-label text-muted small">Username</label>
              <div class="input-group">
                <span class="input-group-text dark-input-group"><i class="fas fa-user text-accent"></i></span>
                <input type="text" name="username" class="form-control dark-input" required placeholder="Enter your username" autofocus>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label text-muted small">Password</label>
              <div class="input-group">
                <span class="input-group-text dark-input-group"><i class="fas fa-lock text-accent"></i></span>
                <input type="password" name="password" class="form-control dark-input" required placeholder="Enter your password">
              </div>
            </div>
            <button type="submit" class="btn btn-accent w-100 btn-lg">
              <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
          </form>
          <hr class="border-secondary my-4">
          <div class="text-center">
            <p class="text-muted small mb-0">Don't have an account?
              <a href="{{ url_for('register') }}" class="text-accent">Register here</a>
            </p>
          </div>
          <div class="text-center mt-3">
            <a href="{{ url_for('shop') }}" class="text-muted small"><i class="fas fa-store me-1"></i>Continue as Guest</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
